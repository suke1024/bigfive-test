<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ビッグファイブ性格診断</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>ビッグファイブ性格診断</h1>
    <p>1〜5で答えてください（1: 全く当てはまらない 〜 5: とても当てはまる）。</p>

    <form id="quiz-form">
      <div id="questions"></div>
      <button type="submit">結果を見る</button>
    </form>

    <section id="result" class="hidden">
      <h2>診断結果</h2>
      <div id="scores"></div>
      <div id="type-description"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
