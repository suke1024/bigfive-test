<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ビッグファイブ診断 結果</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  body {
    font-family: "Helvetica", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 0;
    background: #f7f9fc;
  }

  #shareArea {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px 20px 40px 20px;
  }

  h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
    font-weight: 700;
  }

  /* ===== カードレイアウト ===== */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 22px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .result-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    text-align: center;
    transition: 0.2s ease;
    height: 280px;                 /* ← カード全体の高さ固定 */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;   /* ← 上から順に積む */
  }

  .result-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  .result-title {
    font-size: 20px;
    font-weight: bold;
    color: #0050ff;
    margin-bottom: 6px;
  }

  .result-sub {
    font-size: 14px;
    color: #555;
    margin-bottom: 10px;
  }

  .card-canvas {
    width: 100%;
    height: 120px !important;  /* ★グラフの高さを強制固定 */
    display: block;
    margin-top: auto;
  }

  /* ===== SNSボタン ===== */
  .share-btn {
    display: block;
    width: 85%;
    margin: 20px auto;
    padding: 14px;
    border-radius: 40px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    color: white;
  }
  #shareLINE { background: #00c300; }
  #shareX { background: black; }
  #shareIG { background: #d62976; }

</style>
</head>

<body>

<div id="shareArea">
  <h1>ビッグファイブ診断 結果</h1>

  <!-- カードをここに生成 -->
  <div id="resultCards" class="card-grid"></div>

</div>

<!-- SNSボタン -->
<div>
  <div id="shareLINE" class="share-btn">LINEで共有</div>
  <div id="shareX" class="share-btn">Xで共有</div>
  <div id="shareIG" class="share-btn">Instagram用画像を保存</div>
</div>

<script src="result.js"></script>

</body>
</html>
